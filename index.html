<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e120e">
<!-- Link-preview text (WhatsApp reads these) -->
<title>Nishtha &amp; Akshay · Wedding Invitation</title>
<meta name="description" content="With joy, we invite you to the wedding of Nishtha &amp; Akshay · 11th & 12th February 2027 · Ganesh Mandir, Adajan, Surat">
<meta property="og:title" content="Nishtha &amp; Akshay · Wedding Invitation">
<meta property="og:description" content="With joy, we invite you to the wedding of Nishtha &amp; Akshay · 11th & 12th February 2027 · Ganesh Mandir, Adajan, Surat">
<meta property="og:image" content="preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@400;500&family=Noto+Serif+Gujarati:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="invite.css">
<script>
/* Which invite this is. first: "nishtha" or "akshay" · days: "both" or "wedding" */
window.VARIANT = {"first": "nishtha", "days": "both"};
</script>
<script src="details.js"></script>
</head>
<body class="locked">

<audio id="song" preload="auto" loop></audio>
<button class="music-btn" type="button" aria-label="Music on/off"><svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg></button>

<!-- ============ INTRO ENVELOPE ============ -->
<div class="env" id="env">
  <div class="liner"></div>
  <div class="fl l"><div class="base" data-cover="sides"></div></div>
  <div class="fl r"><div class="base" data-cover="sides"></div></div>
  <div class="fl b"><div class="base" data-cover="bottom"></div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 100L50 46L100 100" fill="none" stroke="#c9a890" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg></div>
  <div class="fl t"><div class="base" data-cover="top"></div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0L50 54L100 0" fill="none" stroke="#c9a890" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg></div>
  <div class="glow"></div>
  <button class="seal" id="openBtn" type="button" aria-label="Tap on the seal to open the invitation">
    <img class="wax" alt="" data-cover="seal">
    <span class="mono" data-k="initials"></span>
  </button>
  <p class="tapnote">TAP ON SEAL &nbsp;—&nbsp; TO OPEN THE INVITATION</p>
</div>

<main>
<!-- ============ HERO ============ -->
<section id="hero">
  <div class="glowbg"></div>
  <svg class="hero-crn a" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M4 4C44 8 78 30 104 78M4 4C8 44 30 78 78 104" fill="none" stroke="#d4a39d" stroke-width="1.1"/>
    <g fill="#9fb08f"><path d="M44 18q10-8 18 0q-10 6-18 0zM18 44q-8 10 0 18q6-10 0-18zM72 44q10-4 14 4q-10 2-14-4zM44 72q-4 10 4 14q2-10-4-14z"/></g>
    <circle cx="24" cy="24" r="11" fill="#9c1f33"/><circle cx="50" cy="34" r="7" fill="#e6a7a8"/>
    <circle cx="34" cy="50" r="7" fill="#f6dcd6"/><circle cx="80" cy="62" r="4.5" fill="#e6a7a8"/><circle cx="62" cy="80" r="4.5" fill="#9c1f33"/>
  </svg>
  <svg class="hero-crn b" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M4 4C44 8 78 30 104 78M4 4C8 44 30 78 78 104" fill="none" stroke="#d4a39d" stroke-width="1.1"/>
    <g fill="#9fb08f"><path d="M44 18q10-8 18 0q-10 6-18 0zM18 44q-8 10 0 18q6-10 0-18zM72 44q10-4 14 4q-10 2-14-4z"/></g>
    <circle cx="24" cy="24" r="11" fill="#9c1f33"/><circle cx="50" cy="34" r="7" fill="#e6a7a8"/>
    <circle cx="34" cy="50" r="7" fill="#f6dcd6"/><circle cx="80" cy="62" r="4.5" fill="#e6a7a8"/>
  </svg>

  <div class="hero-in">
    <div class="invo">
      <span class="ganpati" data-photo-wrap data-label=" "><img data-photo="ganesh" alt=""></span>
      <span class="iv" data-k="invocation"></span>
    </div>
    <p class="h-label" data-k="heroLabel"></p>
    <p class="h-date" data-k="heroDate"></p>
    <h1 class="h-name" data-k="first"></h1>
    <p class="h-amp">&amp;</p>
    <h1 class="h-name" data-k="second"></h1>
  </div>

  <div class="hero-art" data-photo-wrap data-label=" "><img data-photo="coupleArt" alt="Illustration of Nishtha and Akshay"></div>
  <p class="h-scroll">Scroll down</p>
</section>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="orn" viewBox="0 0 150 20"><path d="M6 10h50M94 10h50" stroke="#c9a35c" stroke-width=".9"/><path d="M75 3c-5 3-5 11 0 14c5-3 5-11 0-14z" fill="#9c1f33"/><path d="M62 10l5-4 5 4-5 4zM78 10l5-4 5 4-5 4z" fill="#c9a35c"/></symbol>
  <symbol id="crn" viewBox="0 0 120 120">
    <path d="M4 4C44 8 78 30 104 78M4 4C8 44 30 78 78 104" fill="none" stroke="#7c9463" stroke-width="1.2"/>
    <g fill="#8aa06f"><path d="M44 18q10-8 18 0q-10 6-18 0zM18 44q-8 10 0 18q6-10 0-18zM72 44q10-4 14 4q-10 2-14-4zM44 72q-4 10 4 14q2-10-4-14z"/></g>
    <circle cx="24" cy="24" r="12" fill="#9c1f33"/><path d="M19 25a5 5 0 1 1 8 3M22 22a2.5 2.5 0 1 1 3 2.6" fill="none" stroke="rgba(60,5,15,.5)" stroke-width="1"/>
    <circle cx="52" cy="34" r="8" fill="#e6a7a8"/><circle cx="34" cy="52" r="8" fill="#f6dcd6"/><circle cx="84" cy="62" r="5" fill="#e6a7a8"/><circle cx="62" cy="84" r="5" fill="#9c1f33"/>
  </symbol>
</svg>

<!-- ============ INVITATION ============ -->
<section id="invite">
  <svg class="crn tl"><use href="#crn"/></svg><svg class="crn tr"><use href="#crn"/></svg>
  <p class="lead rv" data-k="inviteLine"></p>
  <h2 class="p-name rv" data-k="first"></h2>
  <p class="p-par rv" data-k="firstParents"></p>
  <p class="p-amp rv">&amp;</p>
  <h2 class="p-name rv" data-k="second"></h2>
  <p class="p-par rv" data-k="secondParents"></p>
  <p class="msg" data-k="message" data-words></p>
  <div class="shot rv" data-label=" "><img data-photo="invitePhoto" alt="Nishtha and Akshay"></div>
</section>

<!-- ============ COUNTDOWN ============ -->
<section id="count" class="tint">
  <h2 class="t-script rv">Save the Date</h2>
  <p class="t-cap rv" data-k="dateLine"></p>
  <svg class="orn"><use href="#orn"/></svg>
  <div class="cd rv">
    <div><b data-cd="d">00</b><small>DAYS</small></div><div><b data-cd="h">00</b><small>HOURS</small></div>
    <div><b data-cd="m">00</b><small>MINS</small></div><div><b data-cd="s">00</b><small>SECS</small></div>
  </div>
  <p class="cd-title rv" data-k="countTitle"></p>
  <p class="cd-note rv" data-k="countNote"></p>
  <p class="done" data-cd-done hidden>Today is the day!</p>
  <a class="btn ghost rv" data-gcal>＋ Add to calendar</a>
</section>

<!-- ============ FUNCTIONS ============ -->
<section id="functions">
  <h2 class="t-script rv">Wedding Celebrations</h2>
  <p class="t-cap rv">join us for every moment</p>
  <svg class="orn"><use href="#orn"/></svg>
  <div id="days"></div>
</section>

<!-- ============ GALLERY ============ -->
<section id="gallery" class="tint">
  <h2 class="t-script rv" data-k="galleryTitle"></h2>
  <svg class="orn"><use href="#orn"/></svg>
  <div class="gal" id="gal"></div>
  <div class="dots" id="dots"></div>
</section>

<!-- ============ VENUE ============ -->
<section id="venue">
  <h2 class="t-script rv">The Venue</h2>
  <svg class="orn"><use href="#orn"/></svg>
  <div id="venues"></div>
</section>

<!-- ============ FAMILY ============ -->
<section id="family" class="tint">
  <svg class="orn"><use href="#orn"/></svg>
  <div id="bless"></div>
</section>

<footer>
  <p class="nm rv"><span data-k="first"></span> &amp; <span data-k="second"></span></p>
  <p class="th rv">Your presence and blessings will make our day complete</p>
  <button class="btn" type="button" data-share>Share Invitation</button>
</footer>
</main>

<script src="invite.js"></script>
</body>
</html>
